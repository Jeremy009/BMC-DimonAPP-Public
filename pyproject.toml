[project]
name = 'dimonapp'
dynamic = ['version']
description = 'Timesheets, Dimona declarations and fiscal fiches 281.27 for Brussels Monkeys Climbing ASBL'
readme = 'README.md'
requires-python = '>=3.13'
dependencies = [
    'alembic>=1.14',
    "argon2-cffi>=23.1",
    "cryptography>=50.0.2",
    "fpdf2>=2.8.9",
    "google-cloud-storage>=3.17.0",
    "lxml>=6.1.3",
    'psycopg[binary]>=3.2',
    'pydantic>=2.10',
    'pydantic-settings>=2.7',
    "pyjwt>=2.15.1",
    "requests>=2.34.2",
    'sqlalchemy>=2.0',
    "streamlit[auth]>=1.50",
    'tomli-w>=1.1',
]

[dependency-groups]
dev = [
    "pypdf>=6.20.0",
    'pytest>=8',
    'ruff>=0.9',
    'testcontainers[postgres]>=4.9',
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

# The version lives in one place (R18.8): src/dimonapp/__init__.py.
[tool.hatch.version]
path = 'src/dimonapp/__init__.py'

[tool.hatch.build.targets.wheel]
packages = ['src/dimonapp']

[tool.pytest.ini_options]
testpaths = ['tests']
# The integration tests call real services: they only run when their folder is named on the
# command line (`make test-rsz`), never with `make test`.
norecursedirs = ['integration']

[tool.ruff]
line-length = 100
src = ['src', 'tests']

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
select = ['E', 'F', 'I', 'UP', 'B']
# Nullable values are written Optional[T], not T | None.
ignore = ['UP007', 'UP045']

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'
