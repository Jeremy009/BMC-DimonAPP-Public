openapi: 3.0.2
info:
  title: Dimona v2 - REST API
  description: This API provides resources related to the Dimona and Personnel File.
  contact:
    name: Dimona support
    url: https://www.socialsecurity.be/site_fr/employer/applics/dimona/introduction/webservice.htm
    email: tbdimona@smals.be
  version: 2.0.0
servers:
- url: https://services.socialsecurity.be/REST/dimona/v2
- url: https://services-sim.socialsecurity.be/REST/dimona/v2
tags:
- name: Monitoring
- name: Declarations
- name: DailyRegistration
- name: Periods
- name: Relations
paths:
  /health:
    get:
      tags:
      - Monitoring
      summary: Check health of the service
      description: This resource is only available to supervision users
      externalDocs:
        url: https://www.belgif.be/specification/rest/api-guide/#health
      operationId: checkHealth
      responses:
        "200":
          description: The service is UP or DEGRADED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              examples:
                responseUp:
                  value:
                    status: UP
                responseDegraded:
                  value:
                    status: DEGRADED
        "500":
          description: a problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        "503":
          description: The service is DOWN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              examples:
                responseDown:
                  value:
                    status: DOWN
        default:
          description: a problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
  /declarations:
    post:
      tags:
      - Declarations
      summary: Create a Dimona or Daily Registration Declaration
      description: "Creation of a Dimona Declaration (IN, OUT, UPDATE or CANCEL) or\
        \ a Daily Registration (IN, UPDATE or CANCEL)"
      operationId: submitDeclaration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclarationRequest'
        required: true
      responses:
        "201":
          description: "Declaration received, you can find the declaration number\
            \ in the 'Location' header of the response."
        "400":
          description: A problem caused by invalid input
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InputValidationProblem'
        default:
          description: a problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - Oauth:
        - scope:dimona:declaration:declarant
        - scope:dimona:declaration:ws-restdimona:dimonaenterprisedeclare
        - scope:dimona:declaration:ws-restdimona:dimonarepresentativedeclare
        - scope:dimona:declaration:ws-restdimona:dimonaprofessionaldeclare
      x-oauth2-required-scopes: any
      x-content-type: application/json
  /declarations/search:
    post:
      tags:
      - Declarations
      summary: Retrieve a list of Dimona Declarations
      description: "Retrieve a list of Dimona declarations based on specific search\
        \ parameters. You need, at least, the employerId, the enterpriseNumber, the\
        \ entrepriseNumber of a userEnterprise or the ssin of a worker."
      operationId: searchDeclarations
      parameters:
      - name: pageSize
        in: query
        description: Maximum number of items per page desired by client; default value
          50.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          default: 50
      - name: page
        in: query
        description: The index of page to be retrieved
        required: false
        style: form
        explode: true
        schema:
          type: integer
          default: 1
      - name: sort
        in: query
        description: Sort the results among a property. Use the prefix '-' to sort
          in descending order. Allowed property is creationDate.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclarationSearchRequest'
        required: true
      responses:
        "200":
          description: List of Dimona declarations and their details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/searchDeclarations_200_response'
        "400":
          description: A problem caused by invalid input
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InputValidationProblem'
        default:
          description: a problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - Oauth:
        - scope:dimona:declaration:consult
        - scope:dimona:declaration:ws-restdimona:dimonaenterpriseconsult
        - scope:dimona:declaration:ws-restdimona:dimonarepresentativeconsult
        - scope:dimona:declaration:ws-restdimona:dimonaprofessionalconsult
        - scope:dimona:declaration:ws-restdimona:dimonaconsultcitizen
      x-oauth2-required-scopes: any
      x-content-type: application/json
  /declarations/{declarationId}:
    get:
      tags:
      - Declarations
      summary: Retrieve a Dimona Declaration
      description: Retrieve a Dimona Declaration using the declaration id
      operationId: getDeclarationByDeclarationId
      parameters:
      - name: declarationId
        in: path
        description: Identification number of the Dimona declaration
        required: true
        style: simple
        explode: false
        schema:
          minimum: 1
          type: integer
          format: int64
        example: 6465484622
      responses:
        "200":
          description: Dimona declaration found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclarationResponse'
        "404":
          description: a problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: a problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - Oauth:
        - scope:dimona:declaration:consult
        - scope:dimona:declaration:ws-restdimona:dimonaenterpriseconsult
        - scope:dimona:declaration:ws-restdimona:dimonarepresentativeconsult
        - scope:dimona:declaration:ws-restdimona:dimonaprofessionalconsult
        - scope:dimona:declaration:ws-restdimona:dimonaconsultcitizen
      x-oauth2-required-scopes: any
  /periods/{periodId}:
    get:
      tags:
      - Periods
      summary: Retrieve a Dimona Period
      description: Retrieve the details of a Dimona period using the identification
        number of the Dimona period
      operationId: getPeriodByPeriodId
      parameters:
      - name: periodId
        in: path
        description: Identification number of the Dimona period
        required: true
        style: simple
        explode: false
        schema:
          minimum: 1
          type: integer
          format: int64
      responses:
        "200":
          description: Dimona period found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Period'
        "404":
          description: a problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: a problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - Oauth:
        - scope:dimona:declaration:consult
        - scope:dimona:declaration:ws-restdimona:dimonaenterpriseconsult
        - scope:dimona:declaration:ws-restdimona:dimonarepresentativeconsult
        - scope:dimona:declaration:ws-restdimona:dimonaprofessionalconsult
        - scope:dimona:declaration:ws-restdimona:dimonaconsultcitizen
      x-oauth2-required-scopes: any
  /periods/search:
    post:
      tags:
      - Periods
      summary: Retrieve a list of Dimona periods
      description: "Retrieve a list of Dimona periods between employer and worker.\
        \ You need, at least, the employerId, the enterpriseNumber, the entrepriseNumber\
        \ of a userEnterprise or the SSIN of a worker."
      operationId: searchPeriods
      parameters:
      - name: pageSize
        in: query
        description: Maximum number of items per page desired by client; default value
          50.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          default: 50
      - name: page
        in: query
        description: The index of page to be retrieved
        required: false
        style: form
        explode: true
        schema:
          type: integer
          default: 1
      - name: sort
        in: query
        description: "Sort the results among a property. Use the prefix '-' to sort\
          \ in descending order. Allowed properties are startDate, endDate, modificationDate"
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodSearchRequest'
        required: true
      responses:
        "200":
          description: List of Dimona periods and their details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/searchPeriods_200_response'
        "400":
          description: A problem caused by invalid input
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InputValidationProblem'
        default:
          description: a problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - Oauth:
        - scope:dimona:declaration:consult
        - scope:dimona:declaration:ws-restdimona:dimonaenterpriseconsult
        - scope:dimona:declaration:ws-restdimona:dimonarepresentativeconsult
        - scope:dimona:declaration:ws-restdimona:dimonaprofessionalconsult
        - scope:dimona:declaration:ws-restdimona:dimonaconsultcitizen
      x-oauth2-required-scopes: any
      x-content-type: application/json
  /relations/search:
    post:
      tags:
      - Relations
      summary: Retrieve a list of relations between employer and worker
      description: "Retrieve a list of relations between employer and worker. You\
        \ need, at least, the employerId, the enterpriseNumber, the entrepriseNumber\
        \ of a userEnterprise or the SSIN of a worker."
      operationId: searchRelations
      parameters:
      - name: pageSize
        in: query
        description: Maximum number of items per page desired by client; default value
          50.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          default: 50
      - name: page
        in: query
        description: The index of page to be retrieved
        required: false
        style: form
        explode: true
        schema:
          type: integer
          default: 1
      - name: sort
        in: query
        description: "Sort the results among a property. Use the prefix '-' to sort\
          \ in descending order. Allowed properties are startDate, endDate"
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationSearchRequest'
        required: true
      responses:
        "200":
          description: List of worker-employer relations and their details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/searchRelations_200_response'
        "400":
          description: A problem caused by invalid input
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InputValidationProblem'
        default:
          description: a problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - Oauth:
        - scope:dimona:declaration:consult
        - scope:dimona:declaration:ws-restdimona:dimonaenterpriseconsult
        - scope:dimona:declaration:ws-restdimona:dimonarepresentativeconsult
        - scope:dimona:declaration:ws-restdimona:dimonaprofessionalconsult
        - scope:dimona:declaration:ws-restdimona:dimonaconsultcitizen
      x-oauth2-required-scopes: any
      x-content-type: application/json
  /dailyRegistrations/{dailyRegistrationId}:
    get:
      tags:
      - DailyRegistration
      summary: Retrieve a daily registration
      description: Retrieve the details of a daily registration using the daily registration
        number identifier
      operationId: getDailyRegistrationByDailyRegistrationId
      parameters:
      - name: dailyRegistrationId
        in: path
        description: Number that uniquely identifies a daily registration
        required: true
        style: simple
        explode: false
        schema:
          minimum: 1
          type: integer
          format: int64
        example: 234567891234
        x-glossary: "01085"
      responses:
        "200":
          description: Daily registration found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyRegistration'
        "404":
          description: a problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: a problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - Oauth:
        - scope:dimona:declaration:consult
        - scope:dimona:declaration:ws-restdimona:dimonaenterpriseconsult
        - scope:dimona:declaration:ws-restdimona:dimonarepresentativeconsult
        - scope:dimona:declaration:ws-restdimona:dimonaprofessionalconsult
        - scope:dimona:declaration:ws-restdimona:dimonaconsultcitizen
      x-oauth2-required-scopes: any
  /dailyRegistrations:
    get:
      tags:
      - DailyRegistration
      summary: Retrieve a list of daily registrations
      description: Retrieve the details of daily registrations thanks to multiple
        parameters
      operationId: searchDailyRegistrations
      parameters:
      - name: periodId
        in: query
        description: Identification number of the Dimona period
        required: true
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          format: int64
        example: 123456789123
        x-glossary: "00913"
      - name: activeFromDate
        in: query
        description: Search for active daily registrations starting from this date
        required: false
        style: form
        explode: true
        schema:
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          type: string
        example: 2000-12-30
      - name: activeToDate
        in: query
        description: Search for active daily registrations up to this date
        required: false
        style: form
        explode: true
        schema:
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          type: string
        example: 2000-12-31
      - name: creationDate
        in: query
        description: Search for active daily registrations created on this date
        required: false
        style: form
        explode: true
        schema:
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          type: string
        example: 2000-12-20
      - name: page
        in: query
        description: Number of requested page in a paged resource collection. Page
          numbers are 1-based.
        required: false
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          default: 1
      - name: pageSize
        in: query
        description: Number of items to retrieve on each page
        required: false
        style: form
        explode: true
        schema:
          type: integer
          default: 50
      - name: sort
        in: query
        description: Sort the results among a property. Use the prefix '-' to sort
          in descending order. Allowed properties are startDate
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: List of daily registrations and their details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/searchDailyRegistrations_200_response'
        "400":
          description: A problem caused by invalid input
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InputValidationProblem'
        default:
          description: a problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - Oauth:
        - scope:dimona:declaration:consult
        - scope:dimona:declaration:ws-restdimona:dimonaenterpriseconsult
        - scope:dimona:declaration:ws-restdimona:dimonarepresentativeconsult
        - scope:dimona:declaration:ws-restdimona:dimonaprofessionalconsult
        - scope:dimona:declaration:ws-restdimona:dimonaconsultcitizen
      x-oauth2-required-scopes: any
components:
  schemas:
    Address:
      required:
      - houseNumber
      - municipality
      - postCode
      - street
      type: object
      properties:
        street:
          type: string
        houseNumber:
          type: string
        boxNumber:
          type: string
        postCode:
          type: string
        municipality:
          $ref: '#/components/schemas/Municipality'
        country:
          maximum: 999
          minimum: 100
          type: integer
          description: NIS code representing a country as defined by statbel.fgov.be
      description: Address
      example:
        country: 231
        street: street
        houseNumber: houseNumber
        municipality:
          code: 64246
          name: name
        boxNumber: boxNumber
        postCode: postCode
    Anomaly:
      type: object
      properties:
        errorId:
          type: string
          description: Identifier of the anomaly - See Annex 30 of the Glossary (https://www.socialsecurity.be/lambda/portail/glossaires/dimona.nsf/web/glossary_home_fr)
          x-glossary: "00108"
        label:
          $ref: '#/components/schemas/LocalizedString'
        type:
          type: string
          description: Type of additional information regarding the anomaly
        value:
          type: string
          description: The value of the type parameter
      description: Block containing the details of an anomaly
      example:
        errorId: errorId
        label:
          de: de
          fr: fr
          nl: nl
        type: type
        value: value
    ConstructionControlCards:
      required:
      - firstMonthC32aNumber
      - nextMonthC32aNumber
      type: object
      properties:
        firstMonthC32aNumber:
          type: string
          description: Control card number C3.2A assigned to the worker for the beginning
            of the Dimona period
          x-glossary: "00663"
        nextMonthC32aNumber:
          type: string
          description: Control card number C3.2A assigned to the worker for the month
            following the month of the beginning of his Dimona period
          x-glossary: "00664"
      description: Block for declaring C3.2A-construction control card data
      example:
        firstMonthC32aNumber: firstMonthC32aNumber
        nextMonthC32aNumber: nextMonthC32aNumber
    DailyRegistration:
      required:
      - periodId
      type: object
      properties:
        dailyRegistrationId:
          minimum: 1
          type: integer
          description: Number that uniquely identifies a daily registration
          format: int64
          example: 234567891234
          x-glossary: "01085"
        periodId:
          minimum: 1
          type: integer
          description: Identification number of the Dimona period
          format: int64
          example: 123456789123
          x-glossary: "00913"
        startDate:
          type: string
          description: Start date of the daily registration
          format: date
          example: 2000-12-30
          x-glossary: "00910"
        startHour:
          pattern: "^[0-2][0-9][0-5][0-9]$"
          type: string
          description: Starting time of the daily registration
          example: "1545"
          x-glossary: "00777"
        endDate:
          type: string
          description: End date of the daily registration
          format: date
          example: 2000-12-31
          x-glossary: "00911"
        endHour:
          pattern: "^[0-2][0-9][0-5][0-9]$"
          type: string
          description: Finishing time of the daily registration
          example: "1645"
          x-glossary: "00778"
        creationDate:
          type: string
          description: Creation date of the daily registration
          format: date
          example: 2000-12-29
        isCanceled:
          type: boolean
          description: "Filter to include cancelled daily registrations. By default,\
            \ all are returned"
          example: true
      description: Block for the data necessary for daily registrations
      example:
        periodId: 123456789123
        endHour: "1645"
        isCanceled: true
        endDate: 2000-12-31T00:00:00.000+00:00
        startHour: "1545"
        creationDate: 2000-12-29T00:00:00.000+00:00
        dailyRegistrationId: 234567891234
        startDate: 2000-12-30T00:00:00.000+00:00
      x-glossary: "90480"
    DailyRegistrationCancel:
      required:
      - dailyRegistrationId
      type: object
      properties:
        references:
          $ref: '#/components/schemas/References'
        dailyRegistrationId:
          minimum: 1
          type: integer
          description: Number that uniquely identifies a daily registration
          format: int64
          example: 234567891234
          x-glossary: "01085"
      description: Block containing the information necessary for a daily registration
        cancel
      example:
        references:
          employer: employer
          worker: worker
          declaration: declaration
        dailyRegistrationId: 234567891234
    DailyRegistrationIn:
      required:
      - periodId
      - startDate
      - startHour
      type: object
      properties:
        references:
          $ref: '#/components/schemas/References'
        periodId:
          minimum: 1
          type: integer
          description: Identification number of the Dimona period
          format: int64
          example: 123456789123
          x-glossary: "00913"
        startDate:
          type: string
          description: Start date of the daily registration
          format: date
          example: 2000-12-30
          x-glossary: "00910"
        startHour:
          pattern: "^[0-2][0-9][0-5][0-9]$"
          type: string
          description: Starting time of the daily registration
          example: "1545"
          x-glossary: "00777"
        endDate:
          type: string
          description: End date of the daily registration
          format: date
          example: 2000-12-31
          x-glossary: "00911"
        endHour:
          pattern: "^[0-2][0-9][0-5][0-9]$"
          type: string
          description: Finishing time of the daily registration
          example: "1645"
          x-glossary: "00778"
      description: Block containing the information necessary for a daily registration
        declaration for entry of service
      example:
        periodId: 123456789123
        endHour: "1645"
        references:
          employer: employer
          worker: worker
          declaration: declaration
        endDate: 2000-12-31T00:00:00.000+00:00
        startHour: "1545"
        startDate: 2000-12-30T00:00:00.000+00:00
    DailyRegistrationUpdate:
      required:
      - dailyRegistrationId
      type: object
      properties:
        references:
          $ref: '#/components/schemas/References'
        dailyRegistrationId:
          minimum: 1
          type: integer
          description: Number that uniquely identifies a daily registration
          format: int64
          example: 234567891234
          x-glossary: "01085"
        startDate:
          type: string
          description: Start date of the daily registration
          format: date
          example: 2000-12-30
          x-glossary: "00910"
        startHour:
          pattern: "^[0-2][0-9][0-5][0-9]$"
          type: string
          description: Starting time of the daily registration
          example: "1545"
          x-glossary: "00777"
        endDate:
          type: string
          description: End date of the daily registration
          format: date
          example: 2000-12-31
          x-glossary: "00911"
        endHour:
          pattern: "^[0-2][0-9][0-5][0-9]$"
          type: string
          description: Finishing time of the daily registration
          example: "1645"
          x-glossary: "00778"
      description: Block containing the information necessary for a daily registration
        modification
      example:
        endHour: "1645"
        references:
          employer: employer
          worker: worker
          declaration: declaration
        endDate: 2000-12-31T00:00:00.000+00:00
        startHour: "1545"
        dailyRegistrationId: 234567891234
        startDate: 2000-12-30T00:00:00.000+00:00
    DeclarationRequest:
      type: object
      properties:
        dimonaIn:
          $ref: '#/components/schemas/DimonaIn'
        dimonaOut:
          $ref: '#/components/schemas/DimonaOut'
        dimonaUpdate:
          $ref: '#/components/schemas/DimonaUpdate'
        dimonaCancel:
          $ref: '#/components/schemas/DimonaCancel'
        dailyRegistrationIn:
          $ref: '#/components/schemas/DailyRegistrationIn'
        dailyRegistrationUpdate:
          $ref: '#/components/schemas/DailyRegistrationUpdate'
        dailyRegistrationCancel:
          $ref: '#/components/schemas/DailyRegistrationCancel'
      description: Details of a Dimona Declaration
      example:
        dimonaCancel:
          periodId: 123456789123
          references:
            employer: employer
            worker: worker
            declaration: declaration
        dailyRegistrationIn:
          periodId: 123456789123
          endHour: "1645"
          references:
            employer: employer
            worker: worker
            declaration: declaration
          endDate: 2000-12-31T00:00:00.000+00:00
          startHour: "1545"
          startDate: 2000-12-30T00:00:00.000+00:00
        dimonaUpdate:
          periodId: 123456789123
          endHour: "1645"
          references:
            employer: employer
            worker: worker
